<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  <!-- University Pillar & Calendar Graphic -->
  <g fill="#ffffff" filter="url(#glow)">
    <path d="M256 100 L380 170 L132 170 Z" fill="#ffffff" opacity="0.95"/>
    <rect x="150" y="185" width="28" height="150" rx="6" fill="#ffffff"/>
    <rect x="206" y="185" width="28" height="150" rx="6" fill="#ffffff"/>
    <rect x="278" y="185" width="28" height="150" rx="6" fill="#ffffff"/>
    <rect x="334" y="185" width="28" height="150" rx="6" fill="#ffffff"/>
    <rect x="120" y="345" width="272" height="24" rx="6" fill="#ffffff"/>
    <rect x="100" y="375" width="312" height="30" rx="8" fill="#ffffff"/>
  </g>
  <!-- Accent Clock Indicator -->
  <circle cx="370" cy="370" r="60" fill="#10b981" stroke="#ffffff" stroke-width="8"/>
  <path d="M370 335 L370 370 L395 385" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
